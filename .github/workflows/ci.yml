# ============================================================================
# VEYRA Desktop - Continuous Integration
#
# Runs on every push and pull request to verify code quality and build success
# across all supported platforms.
# ============================================================================

name: CI

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  ONNXRUNTIME_INSTALL_CUDA: skip

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # TypeScript Type Checking (all projects)
  # --------------------------------------------------------------------------
  typecheck:
    name: TypeCheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (desktop)
        run: npx tsc -p tsconfig.desktop.json --noEmit
        working-directory: .

      - name: Typecheck (client)
        run: npx tsc -p tsconfig.client.json --noEmit
        working-directory: .

      - name: Typecheck (server)
        run: npx tsc -p tsconfig.server.json --noEmit
        working-directory: .

      - name: Typecheck (core)
        run: npx tsc -p tsconfig.core.json --noEmit
        working-directory: .

  # --------------------------------------------------------------------------
  # Linting
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # --------------------------------------------------------------------------
  # Unit Tests
  # --------------------------------------------------------------------------
  test:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

  # --------------------------------------------------------------------------
  # Security Scan
  # --------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run secret check
        run: npm run veyra:secret:check

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Windows Build Verification
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows (NSIS + Portable)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build Electron (TypeScript)
        run: npx tsc -p tsconfig.desktop.json

      - name: Copy database migrations
        run: node scripts/copy-database-migrations.js

      - name: Prepare Electron runtime
        run: node scripts/prepare-electron-runtime.js

      - name: Build Electron preload
        run: node scripts/build-electron-preload.js

      - name: Package Windows (NSIS)
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veyra-windows-${{ github.sha }}
          path: dist/*.exe
          retention-days: 7

  # --------------------------------------------------------------------------
  # macOS Build Verification
  # --------------------------------------------------------------------------
  build-macos:
    name: Build macOS (DMG + ZIP)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build Electron (TypeScript)
        run: npx tsc -p tsconfig.desktop.json

      - name: Copy database migrations
        run: node scripts/copy-database-migrations.js

      - name: Prepare Electron runtime
        run: node scripts/prepare-electron-runtime.js

      - name: Build Electron preload
        run: node scripts/build-electron-preload.js

      - name: Generate icons
        run: |
          if command -v node >/dev/null 2>&1; then
            node scripts/generate-icons.mjs || echo "Icon generation skipped"
          fi

      - name: Package macOS (DMG + ZIP)
        run: npx electron-builder --mac --x64 --arm64 --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_PROVISIONING_PROFILE: ${{ secrets.CSC_PROVISIONING_PROFILE }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veyra-macos-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 7

  # --------------------------------------------------------------------------
  # Linux Build Verification
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux (AppImage + DEB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-common

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build Electron (TypeScript)
        run: npx tsc -p tsconfig.desktop.json

      - name: Copy database migrations
        run: node scripts/copy-database-migrations.js

      - name: Prepare Electron runtime
        run: node scripts/prepare-electron-runtime.js

      - name: Build Electron preload
        run: node scripts/build-electron-preload.js

      - name: Generate icons
        run: |
          if command -v node >/dev/null 2>&1; then
            node scripts/generate-icons.mjs || echo "Icon generation skipped"
          fi

      - name: Package Linux (AppImage + DEB)
        run: npx electron-builder --linux --x64 --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veyra-linux-${{ github.sha }}
          path: dist/*.AppImage
          retention-days: 7

  # --------------------------------------------------------------------------
  # Release Readiness Check
  # --------------------------------------------------------------------------
  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, security, build-windows, build-macos, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"
          echo "VEYRA_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Working tree has uncommitted changes"
            exit 1
          fi

      - name: Verify release artifacts exist
        run: |
          echo "Verifying artifacts from parallel builds..."
          # This would check artifacts in a real release workflow
          echo "Release readiness check passed"