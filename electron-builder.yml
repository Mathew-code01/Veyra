appId: com.veyra.desktop
productName: Veyra
copyright: Copyright © 2025 Veyra. All rights reserved.

directories:
  output: dist
  buildResources: build

files:
  - dist-electron/**/*
  - client/dist/**/*
  - node_modules/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

npmRebuild: false

compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false
  artifactName: Veyra-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Veyra
  license: build/license.txt
  artifactName: Veyra-Setup-${version}.${ext}
  differentialPackage: true

portable:
  artifactName: Veyra-Portable-${version}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements/macos.entitlements.plist
  entitlementsInherit: build/entitlements/macos.inherit.entitlements.plist
  artifactName: Veyra-${version}.${ext}
  notarize: false

dmg:
  contents:
    - x: 130
      y: 220
      type: link
      path: /Applications
    - x: 410
      y: 220
      type: file
  window:
    width: 540
    height: 380
  artifactName: Veyra-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  maintainer: Veyra Team <support@veyra.app>
  artifactName: Veyra-${version}.${ext}
  executableName: veyra
  desktop:
    entry:
      Name: Veyra
      Comment: Privacy-first AI interview copilot
      Categories: Office;Utility;

publish:
  provider: generic
  url: https://updates.veyra.app
