appId: com.veyra.desktop
productName: Veyra
copyright: Copyright © 2025 Veyra. All rights reserved.

directories:
  output: dist
  buildResources: build

files:
  - dist-electron/**/*
  - client/dist/**/*
  - node_modules/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

npmRebuild: false

compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  publisherName: Veyra
  verifyUpdateCodeSignature: false
  rfc3161TimeStampServer: http://timestamp.digicert.com
  certificateFile: ${CSC_LINK}
  certificatePassword: ${CSC_KEY_PASSWORD}
  artifactName: Veyra-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Veyra
  shortcuts:
    - name: Veyra
      target: Veyra.exe
  license: build/license.txt
  artifactName: Veyra-Setup-${version}.${ext}
  differentialPackage: true

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements/macos.entitlements.plist
  entitlementsInherit: build/entitlements/macos.inherit.entitlements.plist
  artifactName: Veyra-${version}.${ext}
  notarize: false
  identity: ${CSC_LINK}
  provisioningProfile: ${CSC_PROVISIONING_PROFILE}

dmg:
  contents:
    - x: 130
      y: 220
      type: link
      path: /Applications
    - x: 410
      y: 220
      type: file
  window:
    width: 540
    height: 380
  icon: build/icon.icns
  artifactName: Veyra-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Office
  maintainer: Veyra Team <support@veyra.app>
  artifactName: Veyra-${version}.${ext}
  executableName: veyra
  desktop:
    Name: Veyra
    Comment: Privacy-first AI interview copilot
    Categories: Office;Utility;
  synapse: false

appImage:
  runtime: fuse

publish:
  provider: generic
  url: https://updates.veyra.app

updateConfig:
  channel: stable
  provider: generic
  url: https://updates.veyra.app